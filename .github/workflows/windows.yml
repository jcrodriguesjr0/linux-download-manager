name: Windows build

on:
  push:
    branches: [windows]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      - name: Testes unitários
        run: python -m unittest discover -s tests -v

      - name: Programa (PyInstaller) + yt-dlp, ffmpeg, deno
        run: python packaging/windows/build.py

      - name: Diagnóstico do executável
        run: build/win/dist/LDM/ldm-cli.exe selftest

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path ldm/__init__.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "LDM_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DDistDir=$pwd\build\win\dist\LDM" `
            "/DOutDir=$pwd\build\win\out" "/DIconFile=$pwd\build\win\stage\ldm.ico" packaging\windows\ldm.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Teste do instalado (instala, abre, API responde, captura de tela)
        shell: pwsh
        run: |
          $out = "$pwd\build\win\out"
          $setup = Get-ChildItem "$out\*-Setup.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Lunix Download Manager\LDM.exe"
          if (-not (Test-Path $exe)) { Write-Error "não instalou em $exe"; exit 1 }
          $p = Start-Process $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              $ping = Invoke-RestMethod -Uri http://127.0.0.1:9614/ping -Headers @{ "X-LDM-Client" = "1" } -TimeoutSec 3
              $ping | ConvertTo-Json -Compress | Write-Output
              $ok = $ping.name -eq "Lunix Download Manager"
            } catch { }
          }
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$out\screenshot.png")
          Write-Output "processo ainda aberto: $(-not $p.HasExited)  código de saída: $($p.ExitCode)"
          $log = "$env:LOCALAPPDATA\LDM\ldm.log"
          if (Test-Path $log) { Copy-Item $log "$out\ldm.log"; Get-Content $log -Tail 80 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { Write-Error "o LDM instalado não respondeu na API"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunix-download-manager-windows
          path: build/win/out/*
          if-no-files-found: warn
