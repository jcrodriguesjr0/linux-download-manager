<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Preview: Botão sobre o Vídeo (LDM)</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #0b0c0e;
    color: #e2e8f0;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { color: #f59e0b; margin-bottom: 8px; }
  p { color: #94a3b8; margin-top: 0; margin-bottom: 24px; }
  
  .player-mockup {
    position: relative;
    width: 640px;
    height: 360px;
    background: linear-gradient(135deg, #181a20, #0d0e12);
    border-radius: 14px;
    border: 1px solid #232936;
    box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .video-art {
    color: #334155;
    font-size: 48px;
    user-select: none;
  }

  /* Video Pill Button CSS */
  .ldm-video-pill {
    position: absolute;
    top: 16px;
    right: 16px;
    display: inline-flex;
    align-items: center;
    background: rgba(20, 22, 27, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 9999px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04);
    padding: 2px 4px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    color: #f1f5f9;
  }
  .ldm-video-pill:hover {
    background: rgba(26, 29, 36, 0.96);
    border-color: #f59e0b;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.65), 0 0 16px rgba(245, 158, 11, 0.28);
  }
  .ldm-btn-main {
    all: unset;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px 6px 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    color: #f1f5f9;
  }
  .ldm-icon {
    width: 14px;
    height: 14px;
    flex: none;
  }
  .ldm-divider {
    width: 1px;
    height: 14px;
    background: rgba(245, 158, 11, 0.25);
    margin: 0 2px;
  }
  .ldm-btn-quality {
    all: unset;
    display: flex;
    align-items: center;
    padding: 6px 8px;
    cursor: pointer;
    color: #f59e0b;
    font-size: 11px;
    font-weight: 600;
    border-radius: 9999px;
  }
  .ldm-btn-quality:hover {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
  }
</style>
</head>
<body>
  <h1>Botão sobre o Vídeo (Identidade Visual LDM)</h1>
  <p>Pílula escura semitransparente, logo em âmbar (#F59E0B), "Baixar" e seletor de qualidade.</p>

  <div class="player-mockup">
    <div class="video-art">▶</div>

    <!-- The floating pill -->
    <div class="ldm-video-pill">
      <button class="ldm-btn-main">
        <svg class="ldm-icon" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="20.5" width="18" height="2.5" rx="1.25" fill="#F59E0B"/>
          <rect x="5" y="2" width="3" height="8.5" rx="1.5" fill="#FBBF24"/>
          <rect x="10.5" y="0.5" width="3" height="10" rx="1.5" fill="#F59E0B"/>
          <rect x="16" y="2" width="3" height="8.5" rx="1.5" fill="#FBBF24"/>
          <path d="M 12 18 L 3.5 9.5 L 20.5 9.5 Z" fill="#F59E0B"/>
        </svg>
        <span>Baixar este vídeo</span>
      </button>
      <div class="ldm-divider"></div>
      <button class="ldm-btn-quality">
        <span>1080p</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:3px;"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
    </div>
  </div>
</body>
</html>
