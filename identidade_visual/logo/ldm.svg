<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Background Dark Graphite/Carbon Gradient -->
    <linearGradient id="ldm_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1A1E"/>
      <stop offset="100%" stop-color="#141316"/>
    </linearGradient>

    <!-- Electric Crimson / Ruby Gradient for Streams & Arrow -->
    <linearGradient id="ldm_red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="35%" stop-color="#FB7185"/>
      <stop offset="70%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Tray Gradient -->
    <linearGradient id="ldm_tray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BE123C" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="ldm_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base (Linux App Icon Standard - KDE & GNOME HIG) -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#ldm_bg)" stroke="#382229" stroke-width="2"/>
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="#FB7185" stroke-width="1" stroke-opacity="0.16"/>

  <!-- Tray (A Bandeja de Arquivo - Linha de Base) -->
  <rect x="32" y="99" width="64" height="7" rx="3.5" fill="url(#ldm_tray)"/>

  <!-- The 3 Segmented Connections (Motor Multi-conexão) -->
  <g filter="url(#ldm_shadow)">
    <!-- Left Connection Stream -->
    <rect x="39" y="27" width="9" height="30" rx="4.5" fill="url(#ldm_red)"/>
    
    <!-- Center Connection Stream (Pivotal, starts slightly higher) -->
    <rect x="59.5" y="21" width="9" height="36" rx="4.5" fill="url(#ldm_red)"/>
    
    <!-- Right Connection Stream -->
    <rect x="80" y="27" width="9" height="30" rx="4.5" fill="url(#ldm_red)"/>

    <!-- Converged Arrow Head (O Arquivo Consolidado) -->
    <path d="M 64 89 L 33 55 L 95 55 Z" fill="url(#ldm_red)"/>
  </g>
</svg>