<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Window Shadow -->
    <filter id="win_shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    
    <!-- Red Accent Gradient -->
    <linearGradient id="red_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Amber Video Gradient -->
    <linearGradient id="amber_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Speed Graph Area Gradient -->
    <linearGradient id="graph_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="600" fill="#0B0C0E"/>

  <!-- Window Frame -->
  <g filter="url(#win_shadow)">
    <!-- Window Background -->
    <rect x="30" y="25" width="900" height="550" rx="14" fill="#14161B" stroke="#2D2328" stroke-width="1.5"/>

    <!-- ==================== HEADERBAR ==================== -->
    <path d="M 30 39 A 14 14 0 0 1 44 25 L 916 25 A 14 14 0 0 1 930 39 L 930 75 L 30 75 Z" fill="#1E1A1E"/>
    <line x1="30" y1="75" x2="930" y2="75" stroke="#382229" stroke-width="1"/>

    <!-- Window Controls (GNOME/SteamOS style) -->
    <circle cx="54" cy="50" r="6.5" fill="#EF4444"/>
    <circle cx="74" cy="50" r="6.5" fill="#F59E0B"/>
    <circle cx="94" cy="50" r="6.5" fill="#22C55E"/>

    <!-- App Title & Icon -->
    <g transform="translate(125, 36)">
      <!-- Mini Squircle Logo -->
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#141316" stroke="#382229" stroke-width="1"/>
      <path d="M 14 20 L 7 13 L 21 13 Z" fill="#F43F5E"/>
      <rect x="7" y="21.5" width="14" height="1.8" rx="0.9" fill="#F43F5E"/>
      <rect x="8.5" y="6" width="2.2" height="6" rx="1.1" fill="#F43F5E"/>
      <rect x="12.9" y="4.5" width="2.2" height="7.5" rx="1.1" fill="#F43F5E"/>
      <rect x="17.3" y="6" width="2.2" height="6" rx="1.1" fill="#F43F5E"/>
      <!-- Title -->
      <text x="36" y="19" font-size="14" font-weight="700" fill="#F1F5F9" letter-spacing="0.02em">LDM</text>
      <text x="72" y="19" font-size="12" font-weight="500" fill="#94A3B8">Linux Download Manager</text>
    </g>

    <!-- Top Action Buttons (44px touch target) -->
    <g transform="translate(490, 35)">
      <!-- + URL Button (Crimson Red) -->
      <rect x="0" y="0" width="115" height="32" rx="7" fill="url(#red_grad)"/>
      <text x="18" y="20.5" font-size="12" font-weight="700" fill="#FFFFFF">+ URL</text>
      <circle cx="98" cy="16" r="3" fill="#FFFFFF" fill-opacity="0.3"/>

      <!-- Baixar Vídeo Button (Amber Highlight) -->
      <rect x="125" y="0" width="125" height="32" rx="7" fill="url(#amber_grad)"/>
      <text x="142" y="20.5" font-size="12" font-weight="700" fill="#FFFFFF">★ Vídeo</text>

      <!-- Pausar Tudo Button -->
      <rect x="260" y="0" width="110" height="32" rx="7" fill="#272228" stroke="#382229" stroke-width="1"/>
      <text x="282" y="20.5" font-size="12" font-weight="600" fill="#E2E8F0">Pausar Tudo</text>

      <!-- Menu Button -->
      <rect x="380" y="0" width="34" height="32" rx="7" fill="#272228" stroke="#382229" stroke-width="1"/>
      <text x="392" y="21" font-size="15" font-weight="700" fill="#E2E8F0">⋮</text>
    </g>

    <!-- ==================== SIDEBAR ==================== -->
    <rect x="30" y="75" width="200" height="430" fill="#181519"/>
    <line x1="230" y1="75" x2="230" y2="505" stroke="#2D2328" stroke-width="1"/>

    <!-- Category Items -->
    <g transform="translate(45, 95)" font-size="13" font-weight="500">
      <!-- Active Item: Todos -->
      <rect x="0" y="0" width="170" height="34" rx="7" fill="#272228" stroke="#382229" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#F43F5E"/>
      <text x="30" y="22" font-weight="600" fill="#FFFFFF">Todos os downloads</text>
      <text x="150" y="22" font-size="11" font-weight="700" fill="#F43F5E">5</text>

      <!-- Em Andamento -->
      <text x="30" y="58" fill="#94A3B8">Em andamento</text>
      <text x="150" y="58" font-size="11" fill="#94A3B8">2</text>

      <!-- Concluídos -->
      <text x="30" y="92" fill="#94A3B8">Concluídos</text>
      <text x="150" y="92" font-size="11" fill="#22C55E">3</text>

      <!-- Vídeos -->
      <text x="30" y="126" fill="#F59E0B">Vídeos capturados</text>
      <text x="150" y="126" font-size="11" fill="#F59E0B">1</text>

      <!-- Fila -->
      <text x="30" y="160" fill="#94A3B8">Filas agendadas</text>
      <text x="150" y="160" font-size="11" fill="#94A3B8">0</text>
    </g>

    <!-- ==================== MAIN CONTENT (DOWNLOAD LIST) ==================== -->
    <!-- Table Header -->
    <g transform="translate(250, 95)" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.05em">
      <text x="0" y="0">ARQUIVO / NOME</text>
      <text x="240" y="0">TAMANHO</text>
      <text x="325" y="0">VELOCIDADE</text>
      <text x="420" y="0">PROGRESSO ("LINHA DE DOWNLOAD VIVA")</text>
      <text x="635" y="0">RESTANTE</text>
    </g>
    <line x1="245" y1="105" x2="915" y2="105" stroke="#251E23" stroke-width="1"/>

    <!-- ROW 1: Active Multi-connection Download (Ubuntu ISO) -->
    <g transform="translate(245, 115)">
      <rect x="0" y="0" width="670" height="74" rx="8" fill="#1C181D" stroke="#33252C" stroke-width="1"/>
      
      <!-- File Info -->
      <text x="16" y="24" font-size="13" font-weight="600" fill="#F1F5F9">ubuntu-24.04-desktop-amd64.iso</text>
      <text x="16" y="42" font-size="11" fill="#64748B">releases.ubuntu.com • 16 conexões ativas</text>
      
      <!-- Size & Speed (JetBrains Mono tabular) -->
      <text x="245" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">3.4 GB / 5.8 GB</text>
      <text x="330" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F43F5E">34.8 MB/s</text>
      <text x="640" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">01m 12s</text>

      <!-- Signature Feature: "Linha de download viva" (Mini mapa de conexões segmentado) -->
      <g transform="translate(16, 52)">
        <!-- Base track -->
        <rect x="0" y="0" width="638" height="10" rx="5" fill="#231F25"/>
        
        <!-- 16 Live Segment Threads (Different stages of download) -->
        <rect x="0" y="0" width="45" height="10" rx="3" fill="#F43F5E"/>
        <rect x="47" y="0" width="38" height="10" rx="3" fill="#F43F5E"/>
        <rect x="87" y="0" width="52" height="10" rx="3" fill="#FB7185"/>
        <rect x="141" y="0" width="30" height="10" rx="3" fill="#F43F5E"/>
        <rect x="173" y="0" width="48" height="10" rx="3" fill="#F43F5E"/>
        <rect x="223" y="0" width="34" height="10" rx="3" fill="#FB7185"/>
        <rect x="259" y="0" width="42" height="10" rx="3" fill="#F43F5E"/>
        <rect x="303" y="0" width="28" height="10" rx="3" fill="#F43F5E"/>
        <rect x="333" y="0" width="55" height="10" rx="3" fill="#FB7185"/>
        <rect x="390" y="0" width="35" height="10" rx="3" fill="#F43F5E"/>
      </g>
    </g>

    <!-- ROW 2: Active Video Stream (YouTube 4K) -->
    <g transform="translate(245, 198)">
      <rect x="0" y="0" width="670" height="74" rx="8" fill="#1C181D" stroke="#382E20" stroke-width="1"/>
      
      <!-- File Info with Amber Highlight -->
      <circle cx="22" cy="22" r="5" fill="#F59E0B"/>
      <text x="34" y="24" font-size="13" font-weight="600" fill="#F1F5F9">Linux Gaming on Steam Deck - Benchmark [4K 60fps].mp4</text>
      <text x="34" y="42" font-size="11" fill="#F59E0B">YouTube Vídeo • Capturado via Extensão LDM</text>
      
      <!-- Size & Speed -->
      <text x="245" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0">1.8 GB / 2.2 GB</text>
      <text x="330" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#F59E0B">22.4 MB/s</text>
      <text x="640" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">00m 18s</text>

      <!-- Video Segmented Bar in Amber -->
      <g transform="translate(16, 52)">
        <rect x="0" y="0" width="638" height="10" rx="5" fill="#231F25"/>
        <rect x="0" y="0" width="120" height="10" rx="3" fill="#F59E0B"/>
        <rect x="123" y="0" width="115" height="10" rx="3" fill="#FBBF24"/>
        <rect x="241" y="0" width="130" height="10" rx="3" fill="#F59E0B"/>
        <rect x="374" y="0" width="140" height="10" rx="3" fill="#FBBF24"/>
      </g>
    </g>

    <!-- ROW 3: Completed Download -->
    <g transform="translate(245, 281)">
      <rect x="0" y="0" width="670" height="58" rx="8" fill="#161418" stroke="#251E23" stroke-width="1"/>
      <text x="16" y="24" font-size="13" font-weight="600" fill="#94A3B8">godot-v4.3-stable_linux.x86_64.zip</text>
      <text x="16" y="42" font-size="11" fill="#22C55E">Concluído • Verificação SHA-256 Íntegra</text>
      <text x="245" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">112 MB / 112 MB</text>
      <text x="330" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#22C55E">100%</text>
      <rect x="420" y="24" width="234" height="8" rx="4" fill="#22C55E"/>
    </g>

    <!-- ==================== FOOTER / SPEED GRAPH ==================== -->
    <path d="M 30 505 L 930 505 L 930 561 A 14 14 0 0 1 916 575 L 44 575 A 14 14 0 0 1 30 561 Z" fill="#19161B"/>
    <line x1="30" y1="505" x2="930" y2="505" stroke="#2D2328" stroke-width="1"/>

    <!-- Speed Sparkline Graph -->
    <g transform="translate(60, 515)">
      <!-- Fill area under curve -->
      <path d="M 0 45 L 30 38 L 70 42 L 120 28 L 170 32 L 220 18 L 270 22 L 320 12 L 370 15 L 420 8 L 470 11 L 520 6 L 520 48 L 0 48 Z" fill="url(#graph_fill)"/>
      <!-- Stroke line -->
      <path d="M 0 45 L 30 38 L 70 42 L 120 28 L 170 32 L 220 18 L 270 22 L 320 12 L 370 15 L 420 8 L 470 11 L 520 6" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="520" cy="6" r="3.5" fill="#FB7185"/>
    </g>

    <!-- Footer Stats (JetBrains Mono) -->
    <g transform="translate(620, 532)" font-family="'JetBrains Mono', monospace">
      <text x="0" y="0" font-size="11" fill="#64748B">VELOCIDADE GLOBAL</text>
      <text x="0" y="20" font-size="16" font-weight="700" fill="#F43F5E">57.2 MB/s</text>

      <text x="160" y="0" font-size="11" fill="#64748B">CONEXÕES TOTAIS</text>
      <text x="160" y="20" font-size="16" font-weight="700" fill="#F1F5F9">24 conexões</text>
    </g>
  </g>
</svg>