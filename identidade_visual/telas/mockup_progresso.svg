<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="p_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="p_red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="#0B0C0E"/>

  <g filter="url(#p_shadow)">
    <!-- Dialog Box -->
    <rect x="30" y="25" width="540" height="330" rx="14" fill="#14161B" stroke="#382229" stroke-width="1.5"/>

    <!-- Header -->
    <path d="M 30 39 A 14 14 0 0 1 44 25 L 556 25 A 14 14 0 0 1 570 39 L 570 65 L 30 65 Z" fill="#1E1A1E"/>
    <line x1="30" y1="65" x2="570" y2="65" stroke="#382229" stroke-width="1"/>
    <text x="50" y="49" font-size="13" font-weight="700" fill="#F1F5F9">Baixando arquivo...</text>

    <!-- Filename -->
    <text x="50" y="95" font-size="14" font-weight="600" fill="#FFFFFF">ArchLinux-2026.10-x86_64.iso</text>
    <text x="50" y="115" font-size="11" fill="#64748B">Status: Baixando (16 conexões simultâneas ativas)</text>

    <!-- Main Progress Bar -->
    <g transform="translate(50, 130)">
      <rect x="0" y="0" width="500" height="12" rx="6" fill="#231F25"/>
      <rect x="0" y="0" width="340" height="12" rx="6" fill="url(#p_red)"/>
    </g>

    <!-- Metrics Grid (JetBrains Mono tabular) -->
    <g transform="translate(50, 165)" font-family="'JetBrains Mono', monospace" font-size="12">
      <text x="0" y="0" fill="#94A3B8">Baixado:</text>
      <text x="120" y="0" font-weight="700" fill="#F1F5F9">1.82 GB de 2.68 GB (68%)</text>

      <text x="0" y="24" fill="#94A3B8">Velocidade:</text>
      <text x="120" y="24" font-weight="700" fill="#F43F5E">42.5 MB/s</text>

      <text x="0" y="48" fill="#94A3B8">Tempo restante:</text>
      <text x="120" y="48" fill="#F1F5F9">00:20</text>
    </g>

    <!-- "Linha de download viva" / Mapa de 16 Conexões -->
    <g transform="translate(50, 245)">
      <text x="0" y="-8" font-size="11" font-weight="600" fill="#64748B">MAPA DO MOTOR MULTI-CONEXÃO (ASSINATURA VISUAL LDM)</text>
      <rect x="0" y="0" width="500" height="24" rx="4" fill="#1C181D" stroke="#2D2328" stroke-width="1"/>
      
      <!-- 16 threads -->
      <rect x="2" y="2" width="28" height="20" rx="2" fill="#F43F5E"/>
      <rect x="33" y="2" width="26" height="20" rx="2" fill="#FB7185"/>
      <rect x="62" y="2" width="32" height="20" rx="2" fill="#F43F5E"/>
      <rect x="97" y="2" width="24" height="20" rx="2" fill="#F43F5E"/>
      <rect x="124" y="2" width="30" height="20" rx="2" fill="#FB7185"/>
      <rect x="157" y="2" width="28" height="20" rx="2" fill="#F43F5E"/>
      <rect x="188" y="2" width="35" height="20" rx="2" fill="#F43F5E"/>
      <rect x="226" y="2" width="22" height="20" rx="2" fill="#FB7185"/>
      <rect x="251" y="2" width="29" height="20" rx="2" fill="#F43F5E"/>
      <rect x="283" y="2" width="34" height="20" rx="2" fill="#F43F5E"/>
      <rect x="320" y="2" width="25" height="20" rx="2" fill="#FB7185"/>
    </g>

    <!-- Buttons -->
    <g transform="translate(370, 295)">
      <rect x="0" y="0" width="85" height="34" rx="6" fill="#272228" stroke="#382229" stroke-width="1"/>
      <text x="24" y="21" font-size="12" font-weight="600" fill="#E2E8F0">Pausar</text>

      <rect x="95" y="0" width="85" height="34" rx="6" fill="#1C181D" stroke="#382229" stroke-width="1"/>
      <text x="114" y="21" font-size="12" font-weight="600" fill="#EF4444">Cancelar</text>
    </g>
  </g>
</svg>