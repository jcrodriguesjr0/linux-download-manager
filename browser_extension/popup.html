<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #ffffff; --card: #f8fafc; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #f43f5e; --video: #f59e0b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141316; --card: #1e1a1e; --fg: #f1f5f9; --muted: #94a3b8; --line: #2e242a; } }
  body { font: 13px Inter, system-ui, sans-serif; margin: 0; width: 340px; background: var(--bg); color: var(--fg); }
  header { background: var(--card); }
  #video { background: linear-gradient(#fbbf24, var(--video)); color: #1a1206; font-weight: 700; border-radius: 8px; }
  input[type=checkbox] { accent-color: var(--accent); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
  header img { width: 24px; }
  header b { flex: 1; }
  #st { font-size: 11px; color: var(--muted); }
  section { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .m { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .m span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 600; }
  button.sec { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  label { display: flex; gap: 6px; align-items: center; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  input[type=number] { width: 70px; }
  .empty { color: var(--muted); }
  .size { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin: 4px 0 0 22px; font-size: 12px; color: var(--muted); }
  .size > span { flex-basis: 100%; }
  .size label { color: var(--fg); }
  input[type=number] { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  input[type=radio] { accent-color: var(--video); }
</style>
</head>
<body>
<header><img src="icon48.png" alt=""><b>Linux Download Manager</b><span id="st">...</span></header>
<section>
  <button id="video" style="width:100%;padding:8px">★ Baixar o vídeo desta página</button>
</section>
<section>
  <label><input type="checkbox" id="capture"> Capturar downloads do navegador</label>
  <label><input type="checkbox" id="overlay"> Mostrar "Baixar este vídeo" sobre os players</label>
  <div class="size" id="sizebox">
    <span>Tamanho do botão:</span>
    <label><input type="radio" name="osize" value="full"> Completo</label>
    <label><input type="radio" name="osize" value="mini"> Mini (só o ícone)</label>
  </div>
</section>
<section>
  <h4>Streams capturados nesta aba</h4>
  <div id="media"><div class="empty">Nenhum ainda. Dê play no vídeo.</div></div>
</section>
<section class="row">
  <button id="all">Baixar todos os links</button>
  <button id="show" class="sec">Abrir o LDM</button>
</section>
<section class="row">
  <label>Porta da API <input type="number" id="port" min="1024" max="65535"></label>
</section>
<script src="popup.js"></script>
</body>
</html>
